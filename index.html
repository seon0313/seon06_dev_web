    <!-- JS를 기다리지 않고 데이터를 먼저 요청 -->
    <script>
      (function () {
        var p = location.pathname, m = p.match(/^\/posts\/(\d+)\/?$/), url = p === '/' ? '/api/posts' : m ? '/api/posts/' + m[1] : null
        if (url) window.__prefetch = { url: url, res: fetch(url).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status) }) }
